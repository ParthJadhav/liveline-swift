name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# A new revision makes every older result for the same PR or branch obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package: ${{ steps.changes.outputs.package }}
      source: ${{ steps.changes.outputs.source }}
      demo: ${{ steps.changes.outputs.demo }}
      full: ${{ steps.changes.outputs.full }}
    steps:
      - name: Classify changed files
        id: changes
        uses: actions/github-script@v9
        with:
          script: |
            const eventName = context.eventName;
            let forceAll = eventName === "workflow_dispatch";
            let full = eventName !== "push";
            let files = [];

            if (eventName === "pull_request") {
              const changed = await github.paginate(
                github.rest.pulls.listFiles,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  per_page: 100,
                }
              );
              files = changed.map((file) => file.filename);
            } else if (eventName === "push") {
              const commits = context.payload.commits || [];
              const reportedSize = context.payload.size || commits.length;
              if (reportedSize > commits.length) {
                // Push payloads cap their commit list. When truncated, running
                // everything is safer than accidentally missing a source file.
                forceAll = true;
              }
              files = commits.flatMap((commit) => [
                ...(commit.added || []),
                ...(commit.modified || []),
                ...(commit.removed || []),
              ]);

              const associatedPulls = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
              });
              const targetBranch = context.ref.replace("refs/heads/", "");
              const landedViaPullRequest = associatedPulls.data.some((pull) =>
                pull.merged_at && pull.base.ref === targetBranch
              );
              // A merged PR already tested its synthetic merge commit. Direct
              // pushes have no such coverage and therefore get the full suite.
              full = !landedViaPullRequest;
            }

            files = [...new Set(files)];
            const workflowChanged = files.includes(".github/workflows/ci.yml");
            const packageChanged = files.some((path) =>
              path === "Package.swift" ||
              path.startsWith("Sources/") ||
              path.startsWith("Tests/")
            );
            const sourceChanged = files.some((path) =>
              path === "Package.swift" || path.startsWith("Sources/")
            );
            const demoChanged = files.some((path) =>
              path === "Package.swift" ||
              path.startsWith("Sources/") ||
              path.startsWith("Examples/LivelineDemo/") ||
              path === "scripts/install-xcodegen.sh" ||
              path === "scripts/run-demo-ui-tests.sh"
            );

            const outputs = {
              package: forceAll || workflowChanged || packageChanged,
              source: forceAll || workflowChanged || sourceChanged,
              demo: forceAll || workflowChanged || demoChanged,
              full,
            };
            for (const [name, value] of Object.entries(outputs)) {
              core.setOutput(name, String(value));
            }

            await core.summary
              .addHeading("CI execution plan", 3)
              .addTable([
                [
                  {data: "Lane", header: true},
                  {data: "Run", header: true},
                ],
                ["Swift package", String(outputs.package)],
                ["Apple platforms", String(outputs.source && outputs.full)],
                ["Current iOS UI", String(outputs.demo && outputs.full)],
              ])
              .addDetails(
                `Changed files (${files.length})`,
                files.length ? files.map((path) => `- ${path}`).join("\n") : "Manual full run"
              )
              .write();

      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate generated project metadata
        run: python3 scripts/storybook_manifest.py validate

      - name: Validate chart visual baselines
        run: scripts/verify-chart-visuals.sh

      - name: Validate Storybook capture scenario overrides
        run: |
          STORYBOOK_SCENARIOS="line-basic-dark" scripts/capture-storybook.sh --validate-only
          if STORYBOOK_SCENARIOS="does-not-exist" scripts/capture-storybook.sh --validate-only; then
            echo "capture-storybook.sh accepted an unknown scenario ID" >&2
            exit 1
          fi

      - name: Validate CI shell scripts
        run: bash -n scripts/*.sh

  swift-package:
    name: Swift Package
    needs: validate
    if: needs.validate.outputs.package == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          fetch-tags: true

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Test package
        run: swift test --disable-index-store

      - name: Build package for release
        if: needs.validate.outputs.full == 'true' && needs.validate.outputs.source == 'true'
        run: swift build -c release --disable-index-store

      - name: Check public API compatibility
        if: needs.validate.outputs.full == 'true' && needs.validate.outputs.source == 'true'
        run: |
          BASELINE_TAG=$(git tag --list '[0-9]*' --sort=-version:refname | head -n 1)
          if [[ -z "$BASELINE_TAG" ]]; then
            echo "No numeric release tag is available for API comparison" >&2
            exit 1
          fi
          echo "Comparing public API with $BASELINE_TAG"
          swift package diagnose-api-breaking-changes "$BASELINE_TAG" --products Liveline

      - name: Build DocC documentation
        if: needs.validate.outputs.full == 'true' && needs.validate.outputs.source == 'true'
        run: >-
          xcodebuild -quiet docbuild
          -scheme Liveline
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          COMPILER_INDEX_STORE_ENABLE=NO
          OTHER_DOCC_FLAGS='--warnings-as-errors'

  apple-platforms:
    name: Apple Platforms
    needs: validate
    if: needs.validate.outputs.full == 'true' && needs.validate.outputs.source == 'true'
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build unique platform targets
        shell: bash
        run: |
          set -euo pipefail
          for platform in watchOS tvOS visionOS; do
            echo "::group::Build $platform"
            xcodebuild -quiet \
              -scheme Liveline \
              -destination "generic/platform=$platform" \
              -derivedDataPath "$RUNNER_TEMP/LivelinePlatformDerivedData" \
              CODE_SIGNING_ALLOWED=NO \
              COMPILER_INDEX_STORE_ENABLE=NO \
              build
            echo "::endgroup::"
          done

  ios-demo-ui:
    name: iOS Demo UI (Current)
    needs: validate
    if: needs.validate.outputs.full == 'true' && needs.validate.outputs.demo == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install pinned XcodeGen
        run: |
          scripts/install-xcodegen.sh "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate demo project
        run: xcodegen generate
        working-directory: Examples/LivelineDemo

      - name: Run demo UI tests
        run: >-
          scripts/run-demo-ui-tests.sh
          latest
          "$RUNNER_TEMP/liveline-demo-ui-tests"
          current

      - name: Upload UI-test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: liveline-demo-ui-tests-current
          path: ${{ runner.temp }}/liveline-demo-ui-tests
          if-no-files-found: warn
          retention-days: 7
